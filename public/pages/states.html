<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>状态墙 · 五种界面状态演示入口 · 职跃AI</title>
<link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="../css/states.css">
<script>
  if (!/[?&]demo=1(?:[&#]|$)/.test(location.search)) location.replace("../index.html");
</script>
</head>
<body data-page="states" data-no-fab>
<a class="skip-link" href="#main">跳到主要内容</a>
<nav class="topnav" aria-label="主导航">
  <span class="brand">职跃AI</span>
  <a class="nav" data-page="home" href="../index.html">首页</a>
  <a class="nav" data-page="f1" href="f1-resume.html">F1 简历诊断</a>
  <a class="nav" data-page="f2" href="f2-match.html">F2 岗位匹配</a>
  <a class="nav" data-page="f3" href="f3-interview.html">F3 模拟面试</a>
  <a class="nav" data-page="f4" href="f4-report.html">F4 能力报告</a>
</nav>
<div class="wrap" id="main">
  <h1 class="page-title">状态墙 · 五状态演示入口</h1>
  <p class="page-sub">4 个功能页 × 5 种状态，共 20 个演示入口；链接会显式开启演示模式，不会作为产品默认结果</p>

  <div class="card">
    <table class="dim state-matrix">
      <thead>
        <tr><th>功能页</th><th>空态</th><th>处理中</th><th>成功</th><th>失败</th><th>降级</th></tr>
      </thead>
      <tbody id="matrix"></tbody>
    </table>
  </div>

  <div class="card">
    <h3>五状态设计规范</h3>
    <div class="req-item"><span class="badge unknown">空态</span><span class="txt">引导上传/粘贴的插画占位 + 主操作按钮</span></div>
    <div class="req-item"><span class="badge covered">处理中</span><span class="txt">AI 呼吸光 + 分析阶段步进器 + 骨架屏（含对应性能门提示）</span></div>
    <div class="req-item"><span class="badge covered">成功</span><span class="txt">完整数据视图，分数均可回指证据</span></div>
    <div class="req-item"><span class="badge missing">失败</span><span class="txt">错误横幅 + 重试；不回退用户已确认的数据</span></div>
    <div class="req-item"><span class="badge weak">降级</span><span class="txt">黄色横幅说明降级原因 + 替代能力（简化匹配/固定题库/表格）</span></div>
  </div>
</div>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var pages = [
    ["F1 简历诊断", "f1-resume.html"],
    ["F2 岗位匹配", "f2-match.html"],
    ["F3 模拟面试", "f3-interview.html"],
    ["F4 能力报告", "f4-report.html"]
  ];
  var states = ["empty", "processing", "success", "error", "degraded"];
  document.getElementById("matrix").innerHTML = pages.map(function (p) {
    return "<tr><td><b>" + p[0] + "</b></td>" + states.map(function (s) {
      return '<td><a href="' + p[1] + "?demo=1&state=" + s + '">' + s + "</a></td>";
    }).join("") + "</tr>";
  }).join("");
});
</script>
<script src="../js/app.js"></script>
</body>
</html>
