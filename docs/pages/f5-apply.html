<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F5 投递管理 · 职跃AI</title>
<link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="../css/states.css">
<link rel="stylesheet" href="../css/sidebar.css">
<style>
  .f5-card { background: #fff; border: 1px solid var(--zy-line, rgba(22,30,52,.10)); border-radius: var(--zy-r-lg, 16px); padding: 20px; margin: 18px 0; }
  .f5-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
  .f5-row label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--zy-ink-2, #4b5261); flex: 1; min-width: 200px; }
  .f5-row input { padding: 10px 12px; border: 1px solid var(--zy-line-2, rgba(22,30,52,.16)); border-radius: var(--zy-r-sm, 8px); font-size: 14px; }
  .f5-row input:focus { outline: none; border-color: var(--zy-primary, #2f5fe8); box-shadow: var(--zy-shadow-focus, 0 0 0 3px rgba(47,107,255,.32)); }
  .f5-msg { min-height: 18px; font-size: 13px; color: var(--zy-ink-3, #7a8699); margin: 12px 0 0; }
  .f5-msg.error { color: var(--zy-missing, #d32424); }
  .f5-preview { margin-top: 14px; padding: 16px; background: var(--zy-surface-2, #fafbfc); border: 1px solid rgba(180,83,9,.28); border-radius: var(--zy-r-md, 12px); }
  .f5-preview h3 { margin: 0 0 10px; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .f5-preview-body { margin: 0 0 14px; white-space: pre-wrap; line-height: 1.8; font-size: 14px; color: var(--zy-ink, #1b1e26); }
  .f5-section { margin: 26px 0 12px; font-size: 17px; }
  .f5-item { background: #fff; border: 1px solid var(--zy-line, rgba(22,30,52,.10)); border-radius: var(--zy-r-md, 12px); padding: 14px 16px; margin-bottom: 12px; }
  .f5-item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .f5-tag { background: rgba(47,107,255,.08); color: var(--zy-primary, #2f5fe8); border-radius: 4px; padding: 2px 8px; font-size: 12px; }
  .f5-del { margin-left: auto; border: 1px solid var(--zy-line-2, rgba(22,30,52,.16)); background: #fff; color: var(--zy-missing, #d32424); border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
  .f5-item-body { margin: 0; white-space: pre-wrap; line-height: 1.7; font-size: 13px; color: var(--zy-ink-2, #4b5261); }
  .f5-empty { color: var(--zy-ink-3, #7a8699); padding: 28px 0; text-align: center; }
</style>
</head>
<body data-page="f5">

<nav class="topnav" aria-label="主导航">
  <button class="zy-sidebar-toggle" id="zySidebarToggle" type="button" aria-label="切换侧边栏" aria-expanded="true">☰</button>
  <span class="brand">职跃AI</span>
  <a class="nav" data-page="home" href="../index.html">首页</a>

</nav>
<div class="wrap" id="main">
  <h1 class="page-title">F5 投递管理</h1>
  <p class="page-sub">生成求职信 → 人工确认 → 保存到申请跟踪</p>
  <div class="f5-card">
    <div class="f5-row">
      <label>目标公司<input id="f5Company" type="text" placeholder="如：字节跳动"></label>
      <label>目标职位<input id="f5Position" type="text" placeholder="如：后端开发工程师"></label>
      <span class="btn primary" id="f5Generate" role="button" tabindex="0">生成求职信</span>
    </div>
    <p class="f5-msg" id="f5Msg"></p>
    <div class="f5-preview zy-hidden" id="f5Preview">
      <h3>求职信预览 <span class="badge weak">待确认</span></h3>
      <p class="f5-preview-body" id="f5PreviewBody"></p>
      <span class="btn primary" id="f5Confirm" role="button" tabindex="0" disabled>确认保存</span>
    </div>
  </div>
  <h2 class="f5-section">申请跟踪</h2>
  <div id="f5Applications"></div>
</div>
<aside class="zy-sidebar" id="zySidebar" aria-label="账号与历史记录">
  <div class="zy-sidebar-head">
    <div class="zy-user-card">
      <div class="zy-avatar" id="zyAvatar">访</div>
      <div class="zy-user-meta">
        <div class="zy-user-name" id="zyUserName">未登录游客</div>
        <div class="zy-user-sub" id="zyUserSub">登录后历史可长期保存</div>
        <button class="zy-user-action" id="zyLoginBtn" type="button">登录 / 注册</button>
        <button class="zy-user-action zy-hidden" id="zyLogoutBtn" type="button">退出登录</button>
      </div>
    </div>
  </div>
  <div class="zy-history">
    <div class="zy-history-title"><span>历史检测记录</span><button class="zy-history-clear zy-hidden" id="zyHistoryClear" type="button">清空</button></div>
    <ul class="zy-history-list" id="zyHistoryList"></ul>
    <div class="zy-history-empty" id="zyHistoryEmpty">还没有检测记录<br>完成一次诊断并登录后，记录会自动出现在这里</div>
    <div class="zy-sidebar-demo-note zy-hidden" id="zyDemoNote">· 以下为演示数据 ·</div>
    <button class="zy-add-record zy-hidden" id="zyAddRecord" type="button">＋ 模拟一次检测</button>
  </div>
</aside>
<div class="zy-sidebar-backdrop" id="zySidebarBackdrop"></div>
<div class="zy-modal zy-hidden" id="zyAuthModal" role="dialog" aria-modal="true" aria-labelledby="zyAuthTitle">
  <div class="zy-modal-box">
    <button class="zy-modal-close" id="zyAuthClose" type="button" aria-label="关闭">×</button>
    <h3 id="zyAuthTitle">登录 / 注册</h3>
    <div class="zy-tabs">
      <button class="zy-tab active" data-tab="login" type="button">登录</button>
      <button class="zy-tab" data-tab="register" type="button">注册</button>
    </div>
    <form class="zy-form" id="zyLoginForm">
      <label>手机号或邮箱<input name="account" type="text" placeholder="手机号或邮箱" required></label>
      <label>登录密码<input name="password" type="password" placeholder="登录密码" required></label>
      <button class="zy-btn" type="submit">登 录</button>
    </form>
    <form class="zy-form zy-hidden" id="zyRegisterForm">
      <label>手机号<input name="phone" type="tel" placeholder="11 位手机号" required></label>
      <label>邮箱<input name="email" type="email" placeholder="you@example.com" required></label>
      <label>邮箱密码<input name="emailPwd" type="password" placeholder="设置平台登录密码" required>
        <span class="zy-hint">请设置专用登录密码，勿使用邮箱本身的密码</span>
      </label>
      <label>账户名<input name="name" type="text" placeholder="2-16 个字符，如：小张" required></label>
      <button class="zy-btn" type="submit">注 册</button>
    </form>
    <p class="zy-form-msg" id="zyAuthMsg"></p>
  </div>
</div>
<script src="../js/mock-data.js"></script>
<script src="../js/app.js"></script>
<script src="../js/pages-api-config.js"></script>
<script src="../js/data-bridge.js"></script>
<script src="../js/account.js"></script>
<script src="../js/f5-apply.js"></script>
</body>
</html>
