# ci.yml · GitHub Actions CI 流水线 (P1-06)
# 触发：push to main / pull_request to main
# 步骤：checkout → setup-python 3.11 → install → pytest → schema validation → 敏感信息扫描

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # --- 步骤1: 检出代码 ---
      - name: Checkout
        uses: actions/checkout@v4

      # --- 步骤2: 安装 Python 3.11 ---
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            tools/requirements.txt

      # --- 步骤3: 安装依赖 ---
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r tools/requirements.txt

      # --- 步骤4: 运行 pytest 测试套件 ---
      - name: Run pytest
        run: |
          # 全量测试为发布门禁：任一失败即 CI 失败。
          python -m pytest tests/ -q --tb=short --junitxml=pytest-results.xml

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run browser contract tests
        run: |
          node --test tests/test_public_page_states.js tests/test_resume_upload.js tests/test_job_upload.js tests/test_publish_mirror.js tests/test_f3_chat_ui.js tests/test_frontend_chain.js

      # --- 步骤5: Schema 校验（对所有 fixtures 执行 validate_schema） ---
      - name: Schema validation
        run: |
          echo "=== Validating all fixtures against their schemas ==="
          # ResumeProfile fixtures
          for f in tests/fixtures-synthetic/resumes/*.expected.json; do
            echo "Validating: $f"
            python tools/validate_schema.py \
              --schema contracts/resume-profile.schema.json \
              --instance "$f"
          done
          # JobProfile fixtures
          for f in tests/fixtures-synthetic/jobs/*.expected.json; do
            echo "Validating: $f"
            python tools/validate_schema.py \
              --schema contracts/job-profile.schema.json \
              --instance "$f"
          done
          # Interview fixtures
          for f in tests/fixtures-synthetic/interviews/*.json; do
            echo "Validating: $f"
            python tools/validate_schema.py \
              --schema contracts/interview-turn.schema.json \
              --instance "$f"
          done
          # Ability fixtures (排除 score-input，它不是 ability-profile schema)
          for f in tests/fixtures-synthetic/abilities/*.json; do
            # 跳过 score-input 文件（这些是评分计算的输入，非 AbilityProfile）
            case "$f" in
              *score-input*) echo "Skipping score-input fixture: $f"; continue ;;
            esac
            echo "Validating: $f"
            python tools/validate_schema.py \
              --schema contracts/ability-profile.schema.json \
              --instance "$f"
          done
          echo "=== All schema validations passed ==="

      # --- 步骤6: 敏感信息扫描 ---
      # 用 grep 检查是否有 API key / secret / password 硬编码
      - name: Sensitive info scan
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          allowed_suffixes = {".py", ".js", ".html", ".md", ".json", ".yml", ".yaml", ".txt", ".sh"}
          ignored_paths = {".env.example", ".gitignore", "SECURITY.md", ".github/workflows/ci.yml", "docs/observability.md"}
          ignored_dirs = {".git", "node_modules", ".venv", "venv", "tests"}  # tests 目录含示例凭据，非真实密钥
          placeholders = re.compile(r"your_|example|placeholder|here|xxx|todo|change|replace|替换|<", re.I)
          patterns = {
              "literal API key": re.compile(r"(?:api[_-]?key|apikey)\s*[=:]\s*['\"][^'\"]{8,}['\"]", re.I),
              "literal secret": re.compile(r"(?:secret|secret_key)\s*[=:]\s*['\"][^'\"]{8,}['\"]", re.I),
              "literal password": re.compile(r"(?:password|passwd|pwd)\s*[=:]\s*['\"][^'\"]{4,}['\"]", re.I),
              "Bearer token": re.compile(r"Bearer\s+[A-Za-z0-9._-]{16,}"),
              "sk-prefixed key": re.compile(r"sk-[A-Za-z0-9]{16,}"),
              "GitHub PAT": re.compile(r"ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}"),
          }
          findings = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or path.suffix.lower() not in allowed_suffixes:
                  continue
              if any(part in ignored_dirs for part in path.parts) or path.as_posix() in ignored_paths:
                  continue
              try:
                  lines = path.read_text(encoding='utf-8').splitlines()
              except UnicodeDecodeError:
                  continue
              for number, line in enumerate(lines, 1):
                  if placeholders.search(line):
                      continue
                  for label, pattern in patterns.items():
                      if pattern.search(line):
                          findings.append((label, path.as_posix(), number))
          if Path('.env').is_file():
              findings.append(("tracked local .env file", ".env", 1))
          if findings:
              print('ERROR: possible sensitive values found (file and line only):')
              for label, path, number in findings:
                  print(f'{label}: {path}:{number}')
              raise SystemExit(1)
          print('Sensitive information scan passed.')
          PY

      # --- 步骤7: 依赖安全扫描（可选，pip-audit） ---
      - name: Dependency security scan (pip-audit)
        continue-on-error: true
        run: |
          pip install pip-audit
          echo "=== Scanning dependencies for known vulnerabilities ==="
          pip-audit -r tools/requirements.txt || true
          echo "=== pip-audit complete (non-blocking) ==="
